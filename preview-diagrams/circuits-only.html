<!DOCTYPE html><html><head><meta charset="utf-8"><title>Circuit symbols</title><style>
body{font-family:system-ui,sans-serif;background:#f8fafc;margin:0;padding:24px;color:#0f172a}
h1{font-size:1.4rem;margin:0 0 8px}
h2{font-size:1.1rem;margin:28px 0 12px;border-bottom:1px solid #e2e8f0;padding-bottom:6px}
.muted{color:#64748b;font-size:0.9rem;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px;text-align:center}
.label{font-size:0.78rem;font-weight:600;margin-bottom:6px;min-height:2.2em}
svg{max-width:100%;height:auto;display:block;margin:0 auto}
</style></head><body><h1>Circuit symbols</h1><div class="grid"><div class="card"><div class="label">Cell</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="cell">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <line x1="74" y1="44" x2="74" y2="76" stroke="#0f172a" stroke-width="3"/>
        <line x1="86" y1="52" x2="86" y2="68" stroke="#0f172a" stroke-width="2"/>
      </g>
</svg></div>
<div class="card"><div class="label">Battery</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="battery">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <line x1="68" y1="44" x2="68" y2="76" stroke="#0f172a" stroke-width="3"/>
        <line x1="76" y1="52" x2="76" y2="68" stroke="#0f172a" stroke-width="2"/>
        <line x1="84" y1="44" x2="84" y2="76" stroke="#0f172a" stroke-width="3"/>
        <line x1="92" y1="52" x2="92" y2="68" stroke="#0f172a" stroke-width="2"/>
      </g>
</svg></div>
<div class="card"><div class="label">Switch (open)</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="switch_open">
        <line x1="44" y1="60" x2="66" y2="60" stroke="#0f172a" stroke-width="2"/>
        <circle cx="66" cy="60" r="3" fill="#0f172a"/>
        <line x1="66" y1="60" x2="92" y2="46" stroke="#0f172a" stroke-width="2"/>
        <circle cx="94" cy="60" r="3" fill="#0f172a"/>
        <line x1="94" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
      </g>
</svg></div>
<div class="card"><div class="label">Switch (closed)</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="switch_closed">
        <line x1="44" y1="60" x2="66" y2="60" stroke="#0f172a" stroke-width="2"/>
        <circle cx="66" cy="60" r="3" fill="#0f172a"/>
        <line x1="66" y1="60" x2="94" y2="60" stroke="#0f172a" stroke-width="2"/>
        <circle cx="94" cy="60" r="3" fill="#0f172a"/>
        <line x1="94" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
      </g>
</svg></div>
<div class="card"><div class="label">Filament lamp</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="lamp">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <circle cx="80" cy="60" r="14" fill="none" stroke="#0f172a" stroke-width="2"/>
        <line x1="70" y1="50" x2="90" y2="70" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="90" y1="50" x2="70" y2="70" stroke="#0f172a" stroke-width="1.5"/>
      </g>
</svg></div>
<div class="card"><div class="label">Fuse</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="fuse">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <rect x="64" y="52" width="32" height="16" fill="none" stroke="#0f172a" stroke-width="2"/>
        <line x1="64" y1="60" x2="96" y2="60" stroke="#0f172a" stroke-width="1.5"/>
      </g>
</svg></div>
<div class="card"><div class="label">Ammeter</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="ammeter">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <circle cx="80" cy="60" r="14" fill="#fff" stroke="#0f172a" stroke-width="2"/>
        <text x="80" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="system-ui,sans-serif">A</text>
      </g>
</svg></div>
<div class="card"><div class="label">Voltmeter</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="voltmeter">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <circle cx="80" cy="60" r="14" fill="#fff" stroke="#0f172a" stroke-width="2"/>
        <text x="80" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="system-ui,sans-serif">V</text>
      </g>
</svg></div>
<div class="card"><div class="label">Diode</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="diode">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <polygon points="70,48 70,72 90,60" fill="none" stroke="#0f172a" stroke-width="2"/>
        <line x1="90" y1="48" x2="90" y2="72" stroke="#0f172a" stroke-width="2"/>
      </g>
</svg></div>
<div class="card"><div class="label">LED</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="led">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <polygon points="70,48 70,72 90,60" fill="none" stroke="#0f172a" stroke-width="2"/>
        <line x1="90" y1="48" x2="90" y2="72" stroke="#0f172a" stroke-width="2"/>
        <line x1="84" y1="42" x2="94" y2="32" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="90" y1="46" x2="100" y2="36" stroke="#0f172a" stroke-width="1.5"/>
        <polygon points="94,32 90,36 98,36" fill="#0f172a"/>
        <polygon points="100,36 96,40 104,40" fill="#0f172a"/>
      </g>
</svg></div>
<div class="card"><div class="label">Fixed resistor</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="resistor">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <rect x="62" y="50" width="36" height="20" fill="none" stroke="#0f172a" stroke-width="2"/>
      </g>
</svg></div>
<div class="card"><div class="label">Variable resistor</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="variable_resistor">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <rect x="62" y="50" width="36" height="20" fill="none" stroke="#0f172a" stroke-width="2"/>
        <line x1="72" y1="78" x2="94" y2="42" stroke="#0f172a" stroke-width="2"/>
        <polygon points="94,42 86,46 92,50" fill="#0f172a"/>
      </g>
</svg></div>
<div class="card"><div class="label">Thermistor</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="thermistor">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <rect x="62" y="50" width="36" height="20" fill="none" stroke="#0f172a" stroke-width="2"/>
        <path d="M 70 76 L 78 76 L 82 44 L 90 44" fill="none" stroke="#0f172a" stroke-width="2"/>
      </g>
</svg></div>
<div class="card"><div class="label">LDR</div><svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 160 120" width="100%" style="max-width:160px;height:auto;display:block;margin:0 auto;background:#fff;">
  <g data-circuit-id="" data-circuit-type="ldr">
        <line x1="44" y1="60" x2="62" y2="60" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="60" x2="116" y2="60" stroke="#0f172a" stroke-width="2"/>
        <rect x="62" y="50" width="36" height="20" fill="none" stroke="#0f172a" stroke-width="2"/>
        <line x1="74" y1="38" x2="64" y2="28" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="82" y1="38" x2="72" y2="28" stroke="#0f172a" stroke-width="1.5"/>
        <polygon points="64,28 68,32 60,32" fill="#0f172a"/>
        <polygon points="72,28 76,32 68,32" fill="#0f172a"/>
      </g>
</svg></div></div></body></html>
