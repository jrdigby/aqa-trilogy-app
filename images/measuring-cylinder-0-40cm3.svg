  </g>

  <g fill="#0f172a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="end">
    <text x="80" y="296">10</text>
    <text x="80" y="216">20</text>
    <text x="80" y="136">30</text>
    <text x="80" y="56">40</text>
  </g>

  <text x="110" y="28" fill="#64748b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">cm<tspan baseline-shift="super" font-size="9">3</tspan></text>
</svg>
